<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0d4a43; color: #fff;
    font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
    position: relative;
  }
  .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(246,179,143,.18); }
  .r1 { width: 760px; height: 760px; right: -260px; top: -120px; }
  .r2 { width: 520px; height: 520px; right: -140px; top: 0; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 92px; background: #136f63; }
  .wrap { position: absolute; left: 80px; top: 74px; right: 80px; }
  .kicker { font-size: 24px; color: #bfe8e0; letter-spacing: 6px; margin: 0 0 8px; }
  h1 { font-size: 72px; line-height: 1.22; margin: 0 0 18px; letter-spacing: 2px; font-weight: 700; white-space: nowrap; }
  .bar { width: 96px; height: 6px; border-radius: 3px; background: #f6b38f; margin: 0 0 20px; }
  .tag { font-size: 30px; color: #f6b38f; margin: 0 0 28px; font-weight: 700; }
  .pills { display: flex; gap: 14px; flex-wrap: wrap; }
  .pill { font-size: 25px; padding: 8px 22px; border-radius: 999px; background: rgba(255,255,255,.12); }
  .pill.star { background: #f6b38f; color: #4a1b0c; font-weight: 700; }
  .url { position: absolute; left: 80px; bottom: 26px; font-size: 26px; color: #e0f2ef; letter-spacing: .5px; }
  .big { position: absolute; right: 80px; top: 119px; width: 300px; height: 300px; }
</style>
</head>
<body>
  <div class="ring r1"></div><div class="ring r2"></div>
  <div class="bottom"></div>
  <svg class="big" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#136f63" stroke="#f6b38f" stroke-width="1.2"/><ellipse cx="32" cy="49" rx="17" ry="5" fill="#bfe8e0"/><rect x="24" y="10" width="4" height="39" rx="1.5" fill="#fff"/><path d="M28 10l20 7-20 7z" fill="#f6b38f"/><circle cx="42" cy="46" r="5" fill="#fff"/></svg>
  <div class="wrap">
    <p class="kicker">GOLF · WELLBEING · CONNECTION</p>
    <h1>高爾夫・<br>身心健康與人際互動</h1>
    <div class="bar"></div>
    <p class="tag">打一場球，照顧身體、安頓心情、連結彼此</p>
    <div class="pills">
      <span class="pill star">★ 身心健康</span>
      <span class="pill star">人際互動</span>
      <span class="pill">品格培養</span>
      <span class="pill">心理訓練</span>
    </div>
  </div>
  <div class="url">kuanyuhou.github.io/golf-wellbeing-connection</div>
</body>
</html>
